[package]
name = "moby-dex"
version = "0.1.0"
edition = "2021"
authors = ["Moby Market Team <dex@moby-market.com>"]
description = "Advanced decentralized exchange optimized for whale trading with MEV protection and sophisticated AMM algorithms"
license = "MIT"
homepage = "https://moby-market.com"
repository = "https://github.com/moby-market/moby-dex"
keywords = ["dex", "amm", "whale-trading", "defi", "mev-protection"]
categories = ["cryptography", "finance", "algorithms"]

[lib]
name = "moby_dex"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Decimal arithmetic for precise financial calculations
rust_decimal = { version = "1.0", features = ["serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "5.0"

# Collections
indexmap = { version = "2.0", features = ["serde"] }

# Cryptography
sha2 = "0.10"
blake3 = "1.4"
ed25519-dalek = "2.0"
k256 = "0.13"
rand = "0.8"
hex = "0.4"

# Mathematical operations
num-bigint = "0.4"
num-traits = "0.2"

# Statistics and algorithms
statrs = "0.16"

# Configuration
config = "0.13"

# Logging
log = "0.4"
env_logger = "0.10"

# Database for trade history and liquidity data
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal"] }

# Rate limiting
governor = "0.6"

# Local dependencies
moby-oracle = { path = "../moby-oracle" }
moby-privacy = { path = "../moby-privacy" }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.0"
tempfile = "3.0"
mock_instant = "0.3"
criterion = "0.5"

[features]
default = ["std"]
std = []
mock = []
constant-product = []
constant-sum = []
concentrated-liquidity = []
order-book = []
mev-protection = []

[[example]]
name = "whale_amm_trading"
path = "examples/whale_amm_trading.rs"

[[example]]
name = "order_book_matching"
path = "examples/order_book_matching.rs"

[[example]]
name = "mev_protection_demo"
path = "examples/mev_protection_demo.rs"

[[example]]
name = "liquidity_provision"
path = "examples/liquidity_provision.rs"

[[example]]
name = "arbitrage_strategies"
path = "examples/arbitrage_strategies.rs"

[[bench]]
name = "amm_performance"
harness = false

[[bench]]
name = "order_matching"
harness = false

[[bench]]
name = "whale_trade_simulation"
harness = false