[package]
name = "moby-trading"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core trading engine and order management for whale trading infrastructure"
homepage = "https://mobymarket.cryptuon.com/"
repository = "https://github.com/cryptuon/mobymarket"
documentation = "https://docs.rs/moby-trading"
keywords = ["defi", "trading", "solana", "twap", "vwap"]

[dependencies]
# Workspace dependencies
moby-math = { path = "../moby-math" }
moby-types = { path = "../moby-types" }
moby-oracle = { path = "../moby-oracle" }

# Solana and Anchor
anchor-lang = { workspace = true }
solana-program = { workspace = true }

# Serialization
borsh = { workspace = true }
serde = { version = "1.0", features = ["derive"] }

# Math and numerics
rust_decimal = "1.32"
fixed = "1.24"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1.0", features = ["full"], optional = true }

# Error handling
thiserror = { workspace = true }
anyhow = "1.0"

# Cryptography
sha2 = "0.10"
ed25519-dalek = "2.0"

# Collections and utilities
indexmap = "2.0"
smallvec = "1.11"

# Feature-gated dependencies
spl-token = { version = "4.0", optional = true }
spl-associated-token-account = { version = "2.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
mock_instant = "0.3"

[features]
default = ["spl-tokens"]
spl-tokens = ["spl-token", "spl-associated-token-account"]
async = ["tokio"]
testing = []

[[bench]]
name = "order_matching"
harness = false

[[bench]]
name = "execution_algorithms"
harness = false