[package]
name = "moby-governance"
version = "0.1.0"
edition = "2021"
authors = ["Moby Market Team <governance@moby-market.com>"]
description = "Decentralized governance system for whale trading protocols"
license = "MIT"
homepage = "https://moby-market.com"
repository = "https://github.com/moby-market/moby-governance"
keywords = ["governance", "dao", "voting", "whale-trading", "defi"]
categories = ["cryptography", "finance", "governance"]

[lib]
name = "moby_governance"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha2 = "0.10"
blake3 = "1.4"
ed25519-dalek = "2.0"
rand = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Decimal arithmetic
rust_decimal = { version = "1.0", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4"

# Collections
indexmap = { version = "2.0", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.0"
tempfile = "3.0"

[features]
default = ["std"]
std = []
mock = []

[[example]]
name = "governance_proposal"
path = "examples/governance_proposal.rs"

[[example]]
name = "voting_system"
path = "examples/voting_system.rs"

[[example]]
name = "delegation_system"
path = "examples/delegation_system.rs"

[[example]]
name = "parameter_updates"
path = "examples/parameter_updates.rs"

[[example]]
name = "token_staking"
path = "examples/token_staking.rs"

[[bench]]
name = "proposal_processing"
harness = false

[[bench]]
name = "voting_performance"
harness = false

[[bench]]
name = "delegation_performance"
harness = false