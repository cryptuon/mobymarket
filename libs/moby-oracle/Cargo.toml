[package]
name = "moby-oracle"
version = "0.1.0"
edition = "2021"
authors = ["Moby Market Team <oracle@moby-market.com>"]
description = "Decentralized oracle infrastructure for whale trading price feeds and data aggregation"
license = "MIT"
homepage = "https://moby-market.com"
repository = "https://github.com/moby-market/moby-oracle"
keywords = ["oracle", "price-feeds", "whale-trading", "defi", "data-aggregation"]
categories = ["cryptography", "finance", "network-programming"]

[lib]
name = "moby_oracle"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha2 = "0.10"
blake3 = "1.4"
ed25519-dalek = "2.0"
k256 = "0.13"
rand = "0.8"
hex = "0.4"

# Networking
reqwest = { version = "0.11", features = ["json"] }
websocket-lite = "0.5"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Decimal arithmetic for precise financial calculations
rust_decimal = { version = "1.0", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "5.0"

# Collections
indexmap = { version = "2.0", features = ["serde"] }

# Statistics and math
statrs = "0.16"

# Configuration
config = "0.13"

# Logging
log = "0.4"
env_logger = "0.10"

# Database for oracle data storage
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal"] }

# Rate limiting
governor = "0.6"

# Circuit breaker for external APIs
failfast = "0.3"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.0"
tempfile = "3.0"
mock_instant = "0.3"
wiremock = "0.5"

[features]
default = ["std"]
std = []
mock = []
chainlink = []
pyth = []
band = []
api3 = []
uma = []

[[example]]
name = "price_feed_aggregation"
path = "examples/price_feed_aggregation.rs"

[[example]]
name = "whale_market_data"
path = "examples/whale_market_data.rs"

[[example]]
name = "oracle_monitoring"
path = "examples/oracle_monitoring.rs"

[[example]]
name = "custom_data_feeds"
path = "examples/custom_data_feeds.rs"

[[example]]
name = "oracle_governance"
path = "examples/oracle_governance.rs"

[[bench]]
name = "price_feed_performance"
harness = false

[[bench]]
name = "aggregation_benchmarks"
harness = false

[[bench]]
name = "data_validation"
harness = false