name: Security Audit

on:
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run cargo audit
      run: cargo audit --json > audit_results.json

    - name: Upload audit results
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-results
        path: audit_results.json

    - name: Check for vulnerabilities
      run: |
        if cargo audit --quiet; then
          echo "✅ No security vulnerabilities found"
        else
          echo "❌ Security vulnerabilities detected"
          exit 1
        fi

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Run cargo deny
      run: cargo deny check

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-license
      run: cargo install cargo-license --locked

    - name: Generate license report
      run: |
        cargo license --json > license_report.json
        cargo license --tsv > license_report.tsv

    - name: Upload license reports
      uses: actions/upload-artifact@v3
      with:
        name: license-reports
        path: |
          license_report.json
          license_report.tsv

    - name: Check license compatibility
      run: |
        # Allow MIT, Apache-2.0, BSD-3-Clause, and ISC licenses
        ALLOWED_LICENSES="MIT,Apache-2.0,BSD-3-Clause,ISC,Unlicense"

        # Check for disallowed licenses
        if cargo license --json | jq -r '.[] | .license' | grep -v -E "^($ALLOWED_LICENSES)$" | head -1; then
          echo "❌ Found disallowed license"
          cargo license
          exit 1
        else
          echo "✅ All licenses are compatible"
        fi

  semver-check:
    name: Semantic Versioning Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-semver-checks
      run: cargo install cargo-semver-checks --locked

    - name: Check semantic versioning
      run: |
        # Check each library for breaking changes
        for lib in libs/*/; do
          if [ -f "$lib/Cargo.toml" ]; then
            echo "Checking semver for $lib"
            cd "$lib"
            cargo semver-checks check-release
            cd - > /dev/null
          fi
        done

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-vet
      run: cargo install cargo-vet --locked

    - name: Initialize cargo-vet (if needed)
      run: |
        if [ ! -f "supply-chain/config.toml" ]; then
          cargo vet init
        fi

    - name: Run cargo vet
      run: cargo vet --locked

  code-scanning:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: 'rust'
        queries: security-and-quality

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build for CodeQL
      run: cargo build --workspace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  smart-contract-security:
    name: Smart Contract Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Solana
      run: |
        sh -c "$(curl -sSfL https://release.solana.com/v1.16.0/install)"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

    - name: Install Anchor
      run: |
        cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
        avm install 0.28.0
        avm use 0.28.0

    - name: Security static analysis
      run: |
        # Run custom security checks for Solana programs
        echo "Running Solana program security checks..."

        # Check for common vulnerabilities
        find programs/ -name "*.rs" -exec grep -l "unsafe" {} \; | while read file; do
          echo "⚠️  Unsafe code found in $file - requires manual review"
        done

        # Check for potential overflow issues
        find programs/ -name "*.rs" -exec grep -l "checked_" {} \; | wc -l | {
          read count
          echo "✅ Found $count files using checked arithmetic operations"
        }

        # Look for proper account validation
        find programs/ -name "*.rs" -exec grep -l "require!" {} \; | wc -l | {
          read count
          echo "✅ Found $count files using require! macros for validation"
        }

    - name: Build programs with security flags
      run: |
        if [ -f "Anchor.toml" ]; then
          # Build with additional security flags
          export RUSTFLAGS="-D warnings -D unsafe-code"
          anchor build
        fi

  publish-security-report:
    name: Publish Security Report
    runs-on: ubuntu-latest
    needs: [audit, deny, license-check, supply-chain, code-scanning]
    if: always()
    steps:
    - uses: actions/checkout@v4

    - name: Generate security summary
      run: |
        cat > security_summary.md << EOF
        # Security Audit Summary

        **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Commit**: ${{ github.sha }}
        **Branch**: ${{ github.ref_name }}

        ## Audit Results

        - **Cargo Audit**: ${{ needs.audit.result }}
        - **Cargo Deny**: ${{ needs.deny.result }}
        - **License Check**: ${{ needs.license-check.result }}
        - **Supply Chain**: ${{ needs.supply-chain.result }}
        - **Code Scanning**: ${{ needs.code-scanning.result }}

        ## Actions Required

        $(if [ "${{ needs.audit.result }}" != "success" ]; then echo "- ❌ Address security vulnerabilities found by cargo audit"; fi)
        $(if [ "${{ needs.deny.result }}" != "success" ]; then echo "- ❌ Resolve cargo deny issues"; fi)
        $(if [ "${{ needs.license-check.result }}" != "success" ]; then echo "- ❌ Fix license compatibility issues"; fi)
        $(if [ "${{ needs.supply-chain.result }}" != "success" ]; then echo "- ❌ Address supply chain security concerns"; fi)
        $(if [ "${{ needs.code-scanning.result }}" != "success" ]; then echo "- ❌ Fix issues found by CodeQL"; fi)

        ## Overall Status

        $(if [ "${{ needs.audit.result }}" = "success" ] && [ "${{ needs.deny.result }}" = "success" ] && [ "${{ needs.license-check.result }}" = "success" ] && [ "${{ needs.supply-chain.result }}" = "success" ] && [ "${{ needs.code-scanning.result }}" = "success" ]; then echo "✅ All security checks passed"; else echo "❌ Some security checks failed - review required"; fi)
        EOF

    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security_summary.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Upload security summary
      uses: actions/upload-artifact@v3
      with:
        name: security-summary
        path: security_summary.md