[workspace]
members = [
    "libs/moby-math",
    "libs/moby-oracle",
    "libs/moby-types",
    "libs/moby-trading",
    "libs/moby-privacy",
]

resolver = "2"

[workspace.dependencies]
# Solana ecosystem
solana-program = "~1.16"
anchor-lang = "~0.29"
anchor-spl = "~0.29"
spl-token = "~4.0"
spl-associated-token-account = "~2.2"

# Math and precision
rust_decimal = { version = "1.32", features = ["serde-float"] }
num-bigint = "0.4"
num-traits = "0.2"

# Cryptography
curve25519-dalek = "4.0"
ed25519-dalek = "2.0"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async and networking
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

# Testing
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

# Utilities
bytemuck = { version = "1.13", features = ["derive"] }
arrayref = "0.3"
uuid = { version = "1.6", features = ["serde", "v4"] }
hex = "0.4"
rand = "0.8"

# ZK and crypto dependencies
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
ark-groth16 = "0.4"
ark-r1cs-std = "0.4"
ark-relations = "0.4"
ark-bn254 = "0.4"

# Async traits
async-trait = "0.1"

# Chronicle for timestamps
chrono = { version = "0.4", features = ["serde"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Moby Market Team"]
license = "MIT"
repository = "https://github.com/moby-market/moby-market"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false

[profile.bench]
inherits = "release"
debug = true